name: Release

# vX.X / vX.X.X 形式のタグを push すると、ソースから dylib をビルドして GitHub Release を作成する。
# バイナリはリポジトリに入れず、Releases のアセットだけに置く。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::タグは vX.X 形式にしてください (例: v3.1)。受け取ったタグ: $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: ./.github/actions/setup-theos

      - name: Host tests
        run: make test

      - name: Build the dylib
        run: make FINALPACKAGE=1

      - name: Locate the dylib
        id: artifact
        run: |
          dylib=$(find .theos -name 'Auto2048.dylib' -type f | head -1)
          if [ -z "$dylib" ]; then
            echo "::error::Auto2048.dylib が見つかりません (ビルドに失敗しています)"
            exit 1
          fi
          echo "path=$dylib" >> "$GITHUB_OUTPUT"
          ls -l "$dylib"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.artifact.outputs.path }}" \
            --title "Auto2048 $GITHUB_REF_NAME" --generate-notes

      - name: Append SHA-256 to the notes
        env:
          GH_TOKEN: ${{ github.token }}
          DYLIB: ${{ steps.artifact.outputs.path }}
        run: |
          sha=$(shasum -a 256 "$DYLIB" | awk '{print $1}')
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          gh release edit "$GITHUB_REF_NAME" \
            --notes "$(printf '%s\n\nSHA-256: `%s`\n' "$body" "$sha")"
