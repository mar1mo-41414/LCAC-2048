name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Solver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and 10,000-board comparison
        run: make test

  build:
    name: Build tweak
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-theos
      - name: Build the dylib
        run: |
          set -o pipefail
          make FINALPACKAGE=1 2>&1 | tee /tmp/theos-build.log
      - name: Report build errors
        if: failure()
        run: |
          tail -n 10 /tmp/theos-build.log | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Check the dylib
        run: |
          dylib=$(find .theos -name 'Auto2048.dylib' -type f | head -1)
          if [ -z "$dylib" ]; then
            echo "::error::Auto2048.dylib がビルドされていません"
            exit 1
          fi
          ls -l "$dylib"

  simulate:
    name: Simulation (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run a short simulation
        run: make simulate SIM_GAMES=1 SIM_MOVES=1000
